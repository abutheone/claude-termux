[package]
name = "claude-termux"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "An inspectable native Termux launcher for the official Claude Code musl binary"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1"
fs2 = "0.4"
goblin = "0.10"
hex = "0.4"
httparse = "1"
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
openssl = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
