name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev
      - name: Prepare Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
          rustup default "${{ matrix.toolchain }}"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check-publish.py
      - run: cargo fmt --all -- --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/check-dependencies.py
